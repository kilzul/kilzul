<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="700" height="450">
  <defs><clipPath id="label"><circle cx="350" cy="240" r="62"/></clipPath></defs>
  <style>
    .spin { transform-box: view-box; transform-origin: 350px 240px; animation: spin 6s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
  <rect width="700" height="450" fill="#F5E6D3"/>
  <line x1="60" y1="14" x2="640" y2="14" stroke="#C68B59" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="350" y="70" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" letter-spacing="6" fill="#3E2723">ON THE SPEAKERS</text>
  <text x="350" y="99" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" fill="#C68B59">~ today's record ~</text>
  <line x1="200" y1="117" x2="500" y2="117" stroke="#C68B59" stroke-width="1.5"/>

  <g class="spin">
    <circle cx="350" cy="240" r="100" fill="#1a1a1a"/>
    <circle cx="350" cy="240" r="90" fill="none" stroke="#333" stroke-width="1"/>
    <circle cx="350" cy="240" r="80" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="350" cy="240" r="71" fill="none" stroke="#333" stroke-width="1"/>
    <circle cx="350" cy="240" r="62" fill="#C68B59"/>
    <circle cx="350" cy="240" r="6" fill="#F5E6D3"/>
  </g>

  <text x="350" y="388" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#3E2723">i love you</text>
  <text x="350" y="420" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic" fill="#5D4037">Billie Eilish</text>
</svg>
