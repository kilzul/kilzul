name: Update song of the day

on:
  schedule:
    - cron: "0 5 * * *"   # every day at 5:00 UTC
  workflow_dispatch:       # adds a manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick today's song
        run: node scripts/update-song.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/now-playing.svg
          git diff --cached --quiet || git commit -m "Update song of the day"
          git push